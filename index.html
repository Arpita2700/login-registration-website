
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="welcome-section">
            <h1>Welcome Back!</h1>
            <p>Access your account and continue your journey with us.</p>
            <div class="welcome-icon">✦</div>
        </div>

        <div class="form-section">

            <div class="tabs">
                <button id="loginTab" class="tab active">Login</button>
                <button id="registerTab" class="tab">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <h2>Login to Account</h2>
                <p class="subtitle">Please enter your details</p>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail"
                           placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="password-box">
                        <input type="password" id="loginPassword"
                               placeholder="Enter your password" required>
                        <button type="button" class="toggle-password"
                                data-target="loginPassword">Show</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" id="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">Login</button>

                <p class="switch-text">
                    Don't have an account?
                    <a href="#" id="goRegister">Register now</a>
                </p>
            </form>

            <!-- Registration Form -->
            <form id="registerForm" class="hidden">
                <h2>Create Account</h2>
                <p class="subtitle">Join us and get started today</p>

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName"
                           placeholder="Enter your name" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="registerEmail"
                           placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="password-box">
                        <input type="password" id="registerPassword"
                               placeholder="Create password"
                               minlength="8" required>
                        <button type="button" class="toggle-password"
                                data-target="registerPassword">Show</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <div class="password-box">
                        <input type="password" id="confirmPassword"
                               placeholder="Confirm password" required>
                        <button type="button" class="toggle-password"
                                data-target="confirmPassword">Show</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Create Account
                </button>

                <p class="switch-text">
                    Already have an account?
                    <a href="#" id="goLogin">Login now</a>
                </p>
            </form>

            <p id="message" class="message" aria-live="polite"></p>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
